{% extends "base.html" %}{% block c %}<h1>🔐 Admins</h1><form class="card" method="post" action="/admin/admins/add"><input type="hidden" name="csrf" value="{{csrf}}"><div class="grid">
<input name="telegram_id" placeholder="Telegram ID" required><input name="name" placeholder="Name"><select name="role"><option>admin</option><option>moderator</option></select><input name="password" type="password" placeholder="Password (10+ chars)" required></div><br><button class="b">Add / update admin</button></form>
<div class="card"><table>{% for a in rows %}<tr><td>{{a.telegram_id}} {{a.name}}</td><td><span class="tag">{{a.role}}</span></td><td>{% if a.telegram_id != root %}<form class="inline" method="post" action="/admin/admins/{{a.telegram_id}}/delete" onsubmit="return confirm('Remove admin?')"><input type="hidden" name="csrf" value="{{csrf}}"><button class="b d">Remove</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
