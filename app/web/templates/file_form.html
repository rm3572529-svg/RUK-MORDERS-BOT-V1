{% extends "base.html" %}{% block c %}<h1>{{ '✏️ Edit file' if f else '📤 Upload file' }}</h1>
<form class="card" method="post" action="/admin/files/save" enctype="multipart/form-data">
<input type="hidden" name="csrf" value="{{csrf}}"><input type="hidden" name="id" value="{{f.id if f else ''}}">
<label>Name *</label><input name="name" required maxlength="200" value="{{f.name if f else ''}}">
<div class="grid"><div><label>Version</label><input name="version" value="{{f.version if f else ''}}"></div>
<div><label>Architecture (e.g. arm64-v8a, 64-bit)</label><input name="architecture" value="{{f.architecture if f else ''}}"></div></div>
<label>Category</label><select name="category_id"><option value="">— none —</option>{% for id,n in cats %}<option value="{{id}}" {{'selected' if f and f.category_id==id}}>{{n}}</option>{% endfor %}</select>
<label>Description</label><textarea name="description" rows="3">{{f.description if f else ''}}</textarea>
<label>Changelog</label><textarea name="changelog" rows="3">{{f.changelog if f else ''}}</textarea>
<label>Search aliases (comma separated, any language)</label><input name="aliases" value="{{f.aliases if f else ''}}">
<label>YouTube tutorial link</label><input name="youtube_url" value="{{f.youtube_url if f else ''}}">
<label>External download link (optional)</label><input name="external_url" value="{{f.external_url if f else ''}}">
<label>Thumbnail (png/jpg/webp)</label><input type="file" name="thumb" accept="image/*">
<label>Files (apk, zip, mcpack, mcaddon… up to {{max_mb}} MB each; select several for multi-part versions)</label><input type="file" name="files" multiple>
<label>…or paste an existing Telegram file_id</label><div class="grid"><input name="tg_file_id" placeholder="file_id"><input name="tg_file_name" placeholder="display name"></div>
<label class="c"><input type="checkbox" name="restricted" {{'checked' if (not f) or f.restricted}}> Requires YouTube verification</label>
<label class="c"><input type="checkbox" name="publish" {{'checked' if f and f.published}}> Published (visible in bot)</label>
<label class="c"><input type="checkbox" name="notify"> Notify all users when first published</label><br><button class="b">Save</button></form>
{% if f and f.assets %}<div class="card"><h3>Attached files</h3><table>{% for a in f.assets %}<tr><td>{{a.file_name}}</td><td>{{'%.1f'|format(a.size/1048576)}} MB</td><td>
<form class="inline" method="post" action="/admin/assets/{{a.id}}/delete"><input type="hidden" name="csrf" value="{{csrf}}"><button class="b d">Remove</button></form></td></tr>{% endfor %}</table></div>{% endif %}{% endblock %}
